validation:
  hardware_status: unverified
  evidence:
  - 根因：FlagScale 的 FlagGems 接入只有 `flag_gems.enable(unused=...)`（全量
    注册）。昆仑芯实测 10 个代表性算子里 9 个在 FlagGems 下更慢（layer_norm
    0.04x、sum 0.03x、add/max 更慢），全量 enable 是净负收益；而打过补丁的
    gelu 家族（gelu-kunlunxin-pow）快 5.8-16.5x。配置 `use_flaggems=true`
    在真实训练里因此既吃到慢 kernel 又吃不到快 kernel。
  - 修复：新增 `flaggems_include` 配置（与 flaggems_exclude 同样的形式：列表 /
    YAML 路径 / "none" 归一化，ListConfig 转 list）。设置时走
    `flag_gems.only_enable`，只注册列出的算子；未设置时行为与基线完全一致
    （全量 enable + exclude）。
  - 基线复现：enable_flaggems(include=[gelu, gelu_backward]) 注册 **349 个**
    op（含 layer_norm）；修复后注册 **2 个**（repro exit 1 -> 0）。
  - 语义回归 7 例（子进程隔离）：include 列表 / 缺省全量 / "none" 归一化 /
    ListConfig / exclude 路径 / use_flaggems=false / include+exclude 优先级
    （WARNING 断言），fixed exit 0。基线 3 例失败（include 被忽略 ×2 +
    优先级用例）即差异所在。
  - dispatch 验证：include 模式下 gelu 前反向实际派发 FlagGems Triton kernel
    （gelu_none_kernel_rank_1 / gelu_backward_none_kernel_rank_1），不再走
    厂商 gelu_highprecision_nv。
  - bench（真实 shape gelu pair，打补丁 FlagGems + 本修复）：vendor 1.86 ms
    -> include 1.17 ms（1.59x）。**必须与 gelu-kunlunxin-pow 同装**：未打补丁
    的 FlagGems gelu_backward_none 内部是 libdevice pow(., 2.0)，在
    12.25M 元素上反向单核 ~10.3 ms（pair 10.8 ms），比厂商 kernel 慢 5.6x。
  - 整步验证（重建负载，AdamW fused + 本修复 + 打补丁 FlagGems，全链路走
    enable_flaggems 集成路径）：2,665.9 -> 2,291.2 ms/step（**-14.0%**），
    与直接 only_enable 的 D 变体一致。数据 results/step-E-final.json。
  - 评审修订（PR3）：声明 requires 依赖 gelu-kunlunxin-pow（check/plan/apply
    的 select() 强制组合——未打补丁时 include 注册的 gelu_backward 含
    libdevice pow，pair 10.8 ms）；include 与 exclude 同时设置时 include
    优先并打印 WARNING（与 flag_gems.use_gems 语义一致），语义测试新增
    该用例。
  - 硬件状态保持 unverified：平台整模型训练未跑；deployable=false、owner=null。
