notes:
- 目标包是 flagscale（同 adamw-fused）；本修复只改 enable_flaggems 的注册
  路径选择，未设置 flaggems_include 时行为与基线逐字节一致（语义回归第 2/3
  例验证）。
- 本修复必须与 `gelu-kunlunxin-pow`（FlagGems 补丁）配套：include 只改变
  "注册谁"，kernel 快慢由 FlagGems 补丁决定。未打补丁时 include=[gelu,
  gelu_backward] 反而吃到含 libdevice pow 的反向（10.3 ms/次 @12.25M 元素）。
- FlagGems 的 `unused`（exclude）过滤对 cpp_patched_ops（含 gelu）不生效
  ——gelu 始终注册。这是 FlagGems 侧行为（基线/修复一致），已作为
  FlagGems 问题记录，见 problem29/ATTRIBUTION.md。
- 多卡 FSDP2 环境未测（本机单卡）；注册发生在 init_distributed 之后、
  建模型之前，与文档口径一致。
