validation:
  hardware_status: unverified
  evidence:
  - 根因：KunlunXIN GELU 家族用 tl_extra_shim.pow(x, 2.0) 求平方；XPU3 将整数指数
    2 的 pow 降低为 libdevice 调用，前向/反向均被它支配，部分手工 kernel 甚至让
    xpu3-elfconv 编译失败（geglu，未纳入本 patch）。改为 x*x 后数学等价，fp32 误差
    不增加（tanh 前向 max_abs_err 1.5e-5 -> 3.8e-6）。
  - 2026-11-10 本地 KunlunXIN 环境（GEMS_VENDOR=kunlunxin，torch 2.9.0+cu129，
    triton 3.0.0，P800/XPU3 栈）实测 (2990, 1024) bf16，同输入同计时口径：
    gelu(tanh) 前向 0.3124 -> 0.0542 ms（5.77x，0.414x -> 2.40x native）；
    gelu_backward 0.5743 -> 0.0639 ms（tanh，8.98x）；gelu_backward 2.5392 ->
    0.1538 ms（none，16.51x，0.119x -> 1.96x native）；gelu_and_mul(tanh) 前向
    1.2972 -> 0.2197 ms（5.90x）。gelu(none) 前向与 gelu_and_mul(none) 不经过
    pow，逐位不变（0.115/0.465 ms）。原始数据 results/bench-{base,fixed}-2026-11-10.json。
  - 精度：tests/test_gelu_accuracy.py 覆盖 fp32/bf16/fp16 × 4 形状 × 连续/转置/切片/
    permute × none/tanh 前反向 + fused gelu_and_mul 前后向，0 failed；
    tests/test_gelu_family_dispatch.py 覆盖 enable() 后 F.gelu / nn.GELU / autograd /
    非连续输入 / gated MLP，0 failed。
  - 复现：tests/repro_gelu_pow.py 在基线上 exit 1（backward 8.41x native、tanh 前向
    2.41x native，阈值 2.0x），修复后 exit 0（0.51x / 0.42x）。
  - 范围限制：只改 _kunlunxin 后端；同源 pow(x,2) 仍在 _kunlunxin/fused/geglu.py
    （可编译但当前实现 21 ms，不适合随本 patch 交付）、其余厂商后端的 GELU 以及
    torch 自带 aten gelu highprecision 路径（厂商二进制，FlagGems 无法覆盖）。
  - hardware_status 保持 unverified：本机为 P800/XPU3 软件栈，但未完成平台 x-benchmark
    整模型验收；deployable=false、owner=null。
  commands:
