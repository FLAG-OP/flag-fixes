notes:
- 目标文件属于 _kunlunxin 厂商后端，不是厂商无关通用文件；cuda 是本环境 KunlunXIN
  栈的设备/dispatch 标识（GEMS_VENDOR=kunlunxin，vendor_info.device_name=cuda）。
- 改动只把 pow(x, 2.0) 换成 x*x（必要时先缓存 x_fp32 与平方值），表达式其余部分与
  基线一致；fp32 与 bf16 的误差均不高于基线。
- 未覆盖：_kunlunxin/fused/geglu.py（pow 会让 xpu3-elfconv 编译失败，去掉 pow 后可
  编译但 kernel 配置本身 21 ms，属于独立问题）；其他厂商后端的 GELU 文件；厂商
  aten GELU highprecision 路径。
- 本修复是性能修复，不改变 API、dispatch 或数值语义；无 requires/conflicts。
- 普通 CI（无设备 runner）只做 validate / pytest / compileall，不执行四个硬件脚本；
  设备缺失时脚本退出码 2，跳过不算通过。
