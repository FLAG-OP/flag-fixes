validation:
  hardware_status: unverified
  evidence:
  - 根因：同一微批内 `negative_1/2/3` 三个槽位各自独立 padding。PR8 第 58 轮
    记录当前三步有效 token 为 94,012，填充后位置为 185,400（49.3% padding），
    但该比例只是批次填充比例；整步收益必须用重排后的 `Σ B×L`、`Σ B×L²` 和
    实际墙钟验证。
  - 修复：`FLAGSCALE_NEGATIVE_LENGTH_REGROUP=1` 时把 30 条负例展平，用真实
    `attention_mask` 长度稳定排序后重新分成 10 条/组；编码完成按原
    `(query, negative slot)` 索引 scatter 回去。缺省路径、锚点/正例、标签、
    优化器和梯度累积边界均不变。
  - 边界：negative 键数量或列表长度不一致、没有 `attention_mask`、批次为空时
    自动回退原路径；回退不视为该模式收益。
  - 本地回归：`tests/test_negative_length_regroup.py` PASS，缺省 4 次 tokenizer
    调用，排序 3 次；确定性 mock 编码器下 loss 在 1e-7 内不变。该测试不使用
    dropout、真实 BGE-M3 权重或设备，因此只证明索引回填语义，不是性能验收。
  - PPU 最小功能 smoke：`BAAI/bge-m3` + T2Ranking triplet-15，3 行 × 2 个负例，
    legacy loss 1.4054532、regroup loss 1.4048704（绝对差 5.83e-4），调用数
    4 -> 3。这是最小 smoke，不是整步验收。
  - PPU 微基准趋势：10 行 × 3 负例时 regroup 中位 +3.38 ms；30 行 × 3 负例时
    中位 -7.74 ms；60 行 × 3 负例时中位 -6.04 ms。这不是原始训练入口的整步
    结果，只能说明候选在更大 batch 下可能有收益。
  - PPU 原始入口一步 A/B：`flagscale/train/train_retrieval.py`，legacy 4 次
    交错运行中位 3.65s，regroup 中位 3.70s，差 +0.05s，在运行间波动内；
    该结果不含多步训练、检索指标和长程梯度/参数验收。
  - 阻断：ZW810E 整步 A/B 未运行；没有整步耗时、tokens/s、峰值显存、loss/
    梯度/更新参数置信区间，不能判断该候选是否值得启用。
  commands:
  - name: negative-length-regroup-regression
    script: tests/test_negative_length_regroup.py
    level: regression
    timeout_seconds: 900
    env:
      PYTHONPATH: '{target}'
notes:
- 本条目是 PR8 第 58 轮提出的“同一微批负例按长度重分组”候选；尚未取得
  ZW810E 结果，必须保持 draft、deployable=false、hardware_status=unverified。
- 环境开关只接受 `1/true/on`；`0/false/off/unset/未知值` 都走原路径。
- tests/bench_negative_length_regroup_ppu.py 是真实模型 forward/backward
  微基准，不是原始训练入口；结果不能直接当作整步收益。
