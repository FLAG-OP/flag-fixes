validation:
  hardware_status: unverified
  evidence:
  - 根因：同一微批内 `negative_1/2/3` 三个槽位各自独立 padding。PR8 第 58 轮
    记录当前三步有效 token 为 94,012，填充后位置为 185,400（49.3% padding），
    但该比例只是批次填充比例；整步收益必须用重排后的 `Σ B×L`、`Σ B×L²` 和
    实际墙钟验证。
  - 修复：`FLAGSCALE_NEGATIVE_LENGTH_REGROUP=1` 时把 30 条负例展平，用真实
    `attention_mask` 长度稳定排序后重新分成 10 条/组；编码完成按原
    `(query, negative slot)` 索引 scatter 回去。缺省路径、锚点/正例、标签、
    优化器和梯度累积边界均不变。
  - 边界：negative 键数量或列表长度不一致、没有 `attention_mask`、批次为空时
    自动回退原路径；回退不视为该模式收益。
  - 本地回归：`tests/test_negative_length_regroup.py` PASS，缺省 4 次 tokenizer
    调用，排序 3 次；确定性 mock 编码器下 loss 在 1e-7 内不变。该测试不使用
    dropout、真实 BGE-M3 权重或设备，因此只证明索引回填语义，不是性能验收。
  - 阻断：ZW810E 整步 A/B 未运行；没有整步耗时、tokens/s、峰值显存、loss/
    梯度/更新参数置信区间，不能判断该候选是否值得启用。
  commands:
  - name: negative-length-regroup-regression
    script: tests/test_negative_length_regroup.py
    level: regression
    timeout_seconds: 900
    env:
      PYTHONPATH: '{target}'
