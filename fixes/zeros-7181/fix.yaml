notes:
- |-
  一个实例覆盖 8 个文件：sum/zeros/zero/zeros_like/abs/absolute 是 #7181 类
  complex dtype 缺口本体；conv2d.py 的 input_c_stride[None] 与
  _thead/ops/linear_backward.py 的 view→reshape 是同一 m2-bert 反向链路上的
  两个预存前置阻塞（各自有独立证据，见 reports/diagnosis.md），
  不含它们则反向到不了、也完不成 complex 修复的验证。
- |-
  src/flag_gems/ops/linear.py 不在本 patch 内：line 158 view→reshape 归
  linear-5379 所有（已合入本仓库 fixes/linear-5379）。本仓库 e2e 目标树
  构造为 baseline + linear-5379.patch + zeros-7181.patch，见 reports/validation.md。
- |-
  未覆盖的 complex 缺口（预存、非本 patch 范围）：mean/full/ones、eq/where 等
  多数 pointwise 的 ComplexMode=NONE 路径、flag_gems 无 autograd 注册导致的
  pad/conv1d 反向梯度缺口（filter_fn 子树）与 native 梯度数值分歧。
- |-
  目标文件中 thead linear_backward 属厂商目录，本机以 cuda dispatch key 运行
  （FlagGems vendor 解析为 thead / ppu-smi）；cuda 是本 PPU 环境的设备/dispatch 标识，
  不代表已验证所有 CUDA 厂商后端。
- |-
  hardware_status 保持 unverified：本地设备三个脚本已跑通，但 problem.md 要求的
