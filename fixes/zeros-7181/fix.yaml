notes:
- |-
  一个实例覆盖 8 个文件，按评审口径分三类改动（同一反向链路的三个层次，故并入
  一个 fix；每类独立验收）：A 类 complex dtype 支持本体（sum/zeros/zero/
  zeros_like/abs/absolute，#7181 缺口）——验收为 KeyError 消失 + native oracle
  数值一致（含 strided/交叉 dtype out 矩阵/模长误差界）；B 类同链路前置阻塞
  （conv2d.py 的 input_c_stride[None] constexpr 与 _thead/ops/linear_backward.py
  的 view→reshape）——不含则反向到不了、也完不成 A 类验证，验收为最小复现 +
  e2e 剥洋葱归属链；C 类后端/依赖边界——ops/linear.py 归 linear-5379（不入本
  patch），requires + e2e_precondition 哈希钉死，验收为 e2e 起跑前 9 文件 sha256
  前置检查、不匹配 exit 2。详见 reports/diagnosis.md「修复与影响」。
- |-
  src/flag_gems/ops/linear.py 不在本 patch 内：line 158 view→reshape 归
  linear-5379 所有（已合入本仓库 fixes/linear-5379）。requires: [linear-5379]
  （select 类命令须同时给出两个 ID）；e2e_precondition 钉死 9 文件 sha256
  （8 目标 + linear.py ddec3383…），e2e 在模型工作前逐文件核对并做双源校验。
  本仓库 e2e 目标树构造为 baseline + linear-5379.patch + zeros-7181.patch，
  见 reports/validation.md。
