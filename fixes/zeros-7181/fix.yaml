    在基线上 git apply --check 干净，patch 应用后的文件内容与 src/ 快照逐字节一致
    （flagfix-fixed 工作树逐文件 cmp 通过）。
  - |-
    2026-11-07 本地 PPU 设备（PPU-ZW810E，torch 2.10.0 + triton 3.6.0）双树实测：
    修复前 tests/repro_complex64.py 退出码 1（KeyError: 'complex64'，
    triton/_utils.py type_canonicalisation_dict，即 problem.md 原始签名）；
    修复前 tests/test_complex_ops.py TOTAL 54 passed / 38 failed（38 条全部为
    complex64/128 路径 KeyError）；修复后 repro 退出码 0、regression
    TOTAL 54 passed / 0 failed。原始输出 results/repro-baseline-2026-11-07.log、
    results/regression-baseline-2026-11-07.log、results/regression-fixed-2026-11-07.log。
  - |-
    真实模型 e2e（tests/test_m2_bert_backward.py，12L/768/8192 全量容器配置）：
    修复前（基线 + linear-5379 + conv2d/linear_backward 机械修复、complex 修复缺失）
    反向在 ops/sum.py:385 sum_dim → sum_dim_kernel_non_inner 抛
    KeyError: 'complex64'，退出码 1（results/e2e-problem-path-noncomplex-2026-11-07.log）；
    再早一层的阻塞（仅基线 + linear-5379）是 _thead/ops/linear_backward.py:170
    view RuntimeError（results/e2e-linearblocker-baseline-2026-11-07.log）；
    修复后 E2E OK：前向 loss 与 native 完全一致 rel=0.000e+00、反向完成、
    161 个梯度 present+finite（384 个 filter_fn 已知缺口跳过），
    results/e2e-fixed-2026-11-07.log，退出码 0。
  - |-
    预存缺陷对照（非本 patch 引入）：无任何 complex 修复的树上以 unused 排除
    sum/zeros/abs/fill 后反向可完成，梯度缺失集合与修复树完全一致
    （1L/64 配置 missing=34：32 个 filter_fn + 2 个未用 pooler），且
    pad/conv1d 告警 "an autograd kernel was not registered" 同现；native 与
    flag_gems 的梯度数值分歧在无 complex 修复树与修复树上同形态出现。
    原始输出 results/gradgap-probe-noncomplex-2026-11-07.log 与
    results/gradgap-probe-fixed-2026-11-07.log。flag_gems 全包无 register_autograd
    调用（grep 0 命中），该类梯度缺口/数值分歧属于预存上游问题，超出 #7181 类修复范围。
  - |-
    issue #7181 最小调用形态直接通过：flag_gems.zeros((2,), dtype=c64/c128) 保 dtype 清零、
