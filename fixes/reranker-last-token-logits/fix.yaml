    timeout_seconds: 3600
    env:
      PYTHONPATH: '{target}'
notes:
- 目标包是 flagscale（同 adamw-fused / flaggems-selective-enable），基线同一 commit
  89f342e6；FlagScale 仓库布局是根下 flagscale/ 包（无 src/ 顶层），verify 预置的
  PYTHONPATH=<target>/src 不存在但无害，命令 env 里用 PYTHONPATH={target}。
- 修复不改打分语义：同一位置、同一权重，bf16 下分数与梯度逐位相同，fp32 权重下在
  1e-4 / 1e-3 以内，因此没有配置开关，也没有保留整序列 logits 的路径。
- 代码路径与厂商无关；设备证据只覆盖 KunlunXin P800 单卡，backends 只登记 kunlunxin。
  A100/PPU/昇腾上的显存收益与行为未实测。
- 除 e2e 外的脚本自包含：按发布版 config.json 在设备上随机初始化同架构权重，
  不依赖 16 GB checkpoint；随机权重的 loss 数值本身无意义，两棵树在日志记录精度下一致
  才是检验点（loss 只保留 6 位小数）。
  repro 的碎片堆是构造的，用于在同一张卡上稳定复现"大请求 + 碎片"。
- e2e 需要环境提供 RERANKER_MODEL（checkpoint 目录）与 RERANKER_DATA（T2Ranking
  triplet-15 parquet），缺失时 exit 2。声明的是单卡 bf16 DDP 形态并以 max_grad_norm=0
  绕开厂商 clip_grad_norm_ 的约 35 GiB 临时张量；2 卡 FSDP2 形态在本机被 F-P800-1
  阻断，未列为命令，尝试记录见 results/e2e-fsdp2-2card-*。
- 复现与等价性脚本需要一张 >= 90 GiB 的空闲卡；设备缺失时退出码 2，跳过不算通过。
- launcher（_torchrun_job.py）：超时清理只对环境里带本作业 id 的进程发 SIGKILL，launcher 自身被
  外部终止时不做清理；可见设备只在有显式 CUDA_VISIBLE_DEVICES 时截断并镜像到 XPU_VISIBLE_DEVICES，
  默认可见或只设 XPU 列表原样透传。只设 XPU 列表时本机 torch_xmlir 栈上 trainer 起不来（厂商栈行为）。
- 未覆盖（已记录）：厂商 clip_grad_norm_ 对 bf16 梯度的临时张量、AdamW step 的
  15.25 GiB 临时张量、平台 batch/accum 配置的回退评估。
