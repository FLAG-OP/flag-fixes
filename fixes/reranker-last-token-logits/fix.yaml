validation:
  hardware_status: unverified
  evidence:
  - 问题（problem26）：Qwen3-Reranker-8B 在昆仑芯 P800 上以 2 卡 FSDP2、fp32 master、
    batch_size=32 训练，若干步后报 "Tried to allocate 11.57 GiB. 96.00 GiB total,
    20.90 GiB free, 71.68 GiB already allocated by PyTorch"；平台把 batch 降到 16 规避，
    显存仍 95/96 GB（FlagScale conf/train/qwen3_reranker_p800.yaml 注释）。
  - 根因：平台注释把 11.57 GiB 归因于 lm_head 的 all-gather，实测 all-gather 只有
    1.157 GiB（trainer 日志 gathers 1185 MiB）。11.57 GiB = 64 对 x 640 token x
    151,669 词表 x 2 B，是 Qwen3RerankerModel.forward 让因果 LM 对每个位置算出的
    整序列 logits（实测 outputs.logits 形状 (64, 640, 151669) bf16），适配器每条序列
    只用 1 行。P800 分配器上 expandable_segments 不生效（PYTORCH_CUDA_ALLOC_CONF 下告警
    UserWarning expandable_segments not supported on this platform，PYTORCH_ALLOC_CONF 下
    静默忽略），碎片后无法提供大块连续显存。
  - 复现（2026-11-26，本机 P800 OAM 96 GiB 单卡，torch 2.9.0+cu129，transformers 4.57.6）：
    tests/repro_reranker_logits_alloc.py 在 "61.0 GiB 常驻 + 34 GiB 不等大碎片" 的堆上跑
    一步真实 reranker_loss。基线 exit 1：
    "Tried to allocate 11.57 GiB ... of which 20.63 GiB is free. Of the allocated memory
    73.51 GiB is allocated by PyTorch"；修复后 exit 0，同一步跑通，峰值 +25.36 GiB。
    常驻量与真实 trainer step 1 之后实测的 61.02 GiB 一致。
  - 数值（tests/test_reranker_scores_equivalence.py，审阅修订后 14 例，两棵树 exit 0）：真实架构
    （36 层、词表 151,669）随机权重，每例记录权重 dtype 与是否 autocast。bf16 权重（autocast
    开或关）5 例分数与 BCE 反向梯度对基线公式 max|diff| 均为 0.0；fp32 权重、无 autocast
    2 例分数 max|diff| 2.4e-7、梯度相对差 2.0e-4（阈值 1e-4 / 1e-3）——fp32 下不是逐位相同。
    梯度比较先验结构（两侧各 9 个预期梯度）并逐张量检查有限，再算误差；7 个 comparator 自检
    用例确认 NaN 梯度、两侧同时缺一个等会被拒绝。真实 trainer + Qwen3-Reranker-8B revision
    77d193c7 + T2Ranking triplet-15 单卡 bf16 batch 16：两棵树 5 步 loss（0.627536/0.466457/
    0.370828/0.639762/0.592430）、train_loss 0.539403、validation_loss 0.461096、test_loss
    0.329392 在日志记录精度（6 位小数）下一致。
  - 分派：CPU 2 层随机 Qwen3 上 lm_head 只收到 [rows, hidden]、每条序列取最后非 pad 位、
    梯度到达 lm_head/embedding/norm/块（25 例，基线 6 例失败 exit 1，修复 exit 0）；
    真实 parallel_utils.apply_fsdp2（CPU/gloo 单 rank）上 lm_head 是 Shard(0) DTensor、
    带 FSDP pre/post hook、每步两个 micro-batch（先关同步再同步）、optimizer 更新
    lm_head 分片（基线 exit 1，修复 exit 0）。
  - 显存与耗时（tests/bench_reranker_step.py，单卡无优化器状态，长度 640）：
    batch 32 LM head 单次输出 11.5714 -> 0.0181 GiB，前向/反向峰值 allocated
    40.80/54.99 -> 29.94/40.61 GiB，前向/反向 3.459/10.129 -> 3.247/9.760 s；
    batch 16 前向峰值 28.60 -> 22.67 GiB。原始 trainer 单卡 bf16 batch 16 五步
    reserved 峰值 92.76 -> 79.64 GiB。
  - 平台形态（2 卡 FSDP2、fp32 master、batch 32、真实权重）的自然复现——数据换成每对都截断到
    640 的长文档子集（T2Ranking shard 0 中 454 行）后，基线第 3 步反向在两个 rank 同时报
    "Tried to allocate 11.57 GiB … of which 20.77 GiB is free. Of the allocated memory 71.66 GiB
    is allocated by PyTorch"，traceback 落在 lm_head 反向对整序列 logits 梯度的物化；与平台
    记录（11.57 / 20.90 / 71.68）逐项吻合。
  - 修复树在同一数据上 4 次 2 卡尝试——前三次分别停在第 2、3、1 步，第 4 次走完 3 步
    （越过基线 OOM 的那一步，step 3 峰值 allocated 84.41 GiB）后停在 validation；可比的 loss
    只有前两步（日志记录精度下与基线一致），第 3 步只有修复树有记录，两边的显存逐步分列于
    reports/validation.md。常规数据上走完 3 步 + validation 后停在收尾。均被 XCCL 集合通信卡死终止（已登记的平台阻断
    F-P800-1，不是 OOM）。本机 2 卡主干触发 14 次、两棵树都中招；修复对照的干净结果来自
    单卡构造堆与真实 apply_fsdp2 的 2 卡单元测试（修复树通过一次）。修复后 batch 32 在
    2 卡上完整跑通这件事未验证。
  - 2026-11-27 在干净提交 c2aef972 上重跑 flag-fixes verify（修复树）：passed=true、6/6 rc=0、
    source_dirty=false，results/verify-2026-11-27.json（对应审阅修订前的脚本）。
  - 审阅修订（flag-fixes PR 11 的评论 7210838015）：launcher 的超时清理改为按作业 id 限定（此前按入口脚本
    路径 pkill -f，会杀同一 checkout 下并行作业的 worker），可见设备只在有显式 CUDA 列表时映射
    （此前默认可见或只设 XPU 列表时 KeyError）。launcher 自测 17 项 exit 0，旧清理方式下同一
    自测 3/14 失败（exit 1，预期）；真实 trainer 在默认可见与显式选卡下各跑完 5 步，只设 XPU
    列表时 launcher 能启动 trainer 但 trainer 在本机厂商栈 import 阶段失败（不在本修复范围）。
    修订后在干净提交 217d46f 上重跑 flag-fixes verify：passed=true、7/7 rc=0、source_dirty=false，
    记录于 results/verify-2026-11-27-r2.json。
  - hardware_status 保持 unverified：平台 2 卡整模型验收未完成；deployable=false、
    owner=null。
