name: Catalog and installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      # validate covers schema + patch/baseline/snapshot hash consistency;
      # compileall only syntax-checks local fix entry scripts (no hardware runners here).
      - run: flag-fixes validate
      - run: python -m compileall -q fixes
      - run: python -m pytest -q
      - run: python -m build
